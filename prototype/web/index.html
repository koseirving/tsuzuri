<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: a single phone-width column, header + scrolling page + bottom tabs, like the iOS app. */

:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}

</style>

function half(s){return [...s].map(c=>{const r=c.codePointAt(0);if(r>=0xff01&&r<=0xff5e)return String.fromCodePoint(r-0xfee0);if(r===0x3000)return " ";if(r===0x2010||r===0x2212)return "-";return c}).join("")}

const id=p=>`${p}${++S.seq}`;
const now=()=>Date.now();
const writerDiaries=wid=>byId[wid].d.map((d,i)=>({id:`${wid}-d${i}`,author:wid,body:d[1],prompt:d[2]||null,at:T0-d[0]*DAY-3*36e5})).sort((a,b)=>b.at-a.at);
const diary=did=>S.diaries.find(d=>d.id===did)||(()=>{const w=did.slice(0,did.lastIndexOf("-d"));return byId[w]?writerDiaries(w).find(d=>d.id===did):null})();
const profile=pid=>pid==="me"?{pen:S.me.pen,age:S.me.age,pref:S.me.pref,bio:S.me.bio,seed:0,g:S.me.g,seek:S.me.seek}:byId[pid];
const active=()=>S.conns.filter(c=>c.status==="active"&&!S.blocked.has(c.partner));
const incoming=()=>S.letters.filter(l=>l.to==="me"&&l.status==="pending"&&!S.blocked.has(l.from));
const outgoing=()=>S.letters.filter(l=>l.from==="me"&&l.status!=="accepted").sort((a,b)=>b.at-a.at);
const pendingOut=()=>S.letters.filter(l=>l.from==="me"&&l.status==="pending").length;
function relation(uid){
  const c=S.conns.find(c=>c.partner===uid);
  if(c)return{kind:c.status==="active"?"connected":"closed",c};
  const l=[...S.letters].reverse().find(l=>(l.from==="me"&&l.to===uid)||(l.from===uid&&l.to==="me"));
  if(!l)return{kind:"none"};
  if(l.status!=="pending")return{kind:"closed",l};
  return{kind:l.from==="me"?"sent":"received",l};
}
function intros(){
  if(!S.me||S.me.paused)return[];
  if(!S.intro){
    const excluded=new Set([...S.blocked,...S.conns.map(c=>c.partner),...S.letters.map(l=>l.from==="me"?l.to:l.from)]);
    const eligible=WRITERS.filter(w=>!excluded.has(w.id)&&mutual(S.me,w)).map(w=>w.id).sort();
    S.intro=shuffle(eligible,hash(new Date().toDateString()+"/me")).slice(0,LIMIT.intros);
  }
  return S.intro.filter(x=>!S.blocked.has(x)).map(x=>byId[x]);
}
function connect(partner){
  const c={id:id("c"),partner,at:now(),status:"active",photo:"hidden",by:null,byAt:0};
  S.conns.push(c);
  S.pages.push({id:id("p"),conn:c.id,author:partner,body:`つながってくれて、ありがとうございます。${byId[partner].pen}です。急がず、思い出したときに書いていきましょう。`,at:now(),replies:[]});
  return c;
}
function tick(){
  if(!S.me)return;
  let changed=false;const t=now();
  for(const l of S.letters){
    if(l.status==="pending"&&l.from==="me"&&t-l.at>=DEMO_DELAY&&!S.blocked.has(l.to)&&active().length<LIMIT.conns){l.status="accepted";connect(l.to);changed=true}
  }
  for(const c of active()){
    if(c.photo==="proposed"&&c.by==="me"&&t-c.byAt>=DEMO_DELAY){c.photo="revealed";changed=true}
    const ps=S.pages.filter(p=>p.conn===c.id);const last=ps[ps.length-1];
    if(last&&last.author==="me"&&!last.replies.some(r=>r.author===c.partner)&&t-last.at>=DEMO_DELAY){
      const used=ps.reduce((n,p)=>n+p.replies.filter(r=>r.author===c.partner).length,0);
      const w=byId[c.partner];last.replies.push({author:c.partner,body:w.r[used%w.r.length],at:t});changed=true;
    }
  }
  if(changed)render();
}
setInterval(tick,1000);

// ---------------------------------------------------------------- helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateLabel=t=>{const d=new Date(t);return `${d.getMonth()+1}月${d.getDate()}日`};
const line=p=>`${esc(p.age)}・${esc(p.pref)}`;
const hint=t=>`<p class="hint">${t}</p>`;
function photo(p,shown,size=52){
  const [a,b]=PALETTE[p.seed%PALETTE.length];
  return shown?`<span class="photo" style="--s:${size}px;background:linear-gradient(135deg,${a},${b})">${esc([...p.pen][0])}</span>`
              :`<span class="photo locked" style="--s:${size}px" aria-label="写真はまだ見えません">🔒︎</span>`;
}
let toastTimer;
function toast(msg){document.querySelectorAll(".toast").forEach(e=>e.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200)}
const cur=()=>S.stack[S.stack.length-1];
function go(v){S.menu=false;S.stack.push(v);render(true)}
function back(){S.menu=false;if(S.stack.length>1)S.stack.pop();render(true)}
function home(tab){S.menu=false;S.stack=[{v:"tab",tab:tab||cur().tab||S.stack[0].tab}];render(true)}
function sheet(html,onMount){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});
  document.body.append(bg);onMount&&onMount(bg.firstElementChild,()=>bg.remove());
  bg.querySelector("button,textarea")?.focus();
}
function ask(title,msg,action,danger,ok){
  sheet(`<h4>${esc(title)}</h4><p class="sub">${esc(msg)}</p><button class="${danger?"danger":"primary"}" data-ok>${esc(action)}</button><button class="ghost" data-no>やめておく</button>`,
    (el,close)=>{el.querySelector("[data-ok]").onclick=()=>{close();ok()};el.querySelector("[data-no]").onclick=close});
}

    return {title:"設定",back:true,body:`<h2>${esc(m.pen)}</h2><p class="sub">${esc(m.age)}・${esc(m.pref)}</p>
      <h3>出会いたい相手</h3><p class="sub">あなたの性別：${GENDER[m.g]}（ほかの人には表示されません）</p>
      <div class="chips">${ALL.map(g=>`<button class="chip" data-act="set-seek" data-g="${g}" aria-pressed="${m.seek.includes(g)}">${GENDER[g]}</button>`).join("")}</div>
      <h3>お休み</h3><label class="row" style="cursor:pointer"><input type="checkbox" id="pause" style="width:auto" ${m.paused?"checked":""}><span>お休みモード<br><span class="sub">紹介を止めて、あなたの日記もだれにも紹介されなくなります。つながりはそのまま続きます。</span></span></label>
      <h3>ブロックした人</h3>${S.blocked.size?[...S.blocked].map(x=>`<div class="row"><span class="grow">${esc(byId[x].pen)}</span><button class="link" data-act="unblock" data-id="${x}">解除</button></div>`).join(""):`<p class="sub">いません。</p>`}
      <h3>データ</h3><button class="danger" data-act="wipe">最初からやり直す</button>`};
  },
};

// ---------------------------------------------------------------- render
function render(scrollTop){
  const v=cur();
  const main=$("#main"),keepScroll=main.scrollTop;
  let out;
  if(!S.me)out=screens.onboarding();
  else if(v.v==="tab")out=screens[v.tab]();
  else out=screens[v.v](v);
  $("#title").textContent=out.title;
  $("#back").hidden=!out.back;
  const ha=$("#head-actions");ha.innerHTML="";
  if(S.me&&v.v==="tab")ha.innerHTML=`<button class="icon" data-act="settings" aria-label="設定">⚙︎</button>`;
  if(out.safety){
    ha.innerHTML=`<div class="menu"><button class="icon" data-act="menu" aria-label="安全のためのメニュー" aria-expanded="${S.menu}">⋯</button>${S.menu?`<div class="menu-list">${out.safety.conn?`<button data-act="end" data-id="${out.safety.conn}">関係を終える</button>`:""}<button data-act="block" data-id="${out.safety.target}">ブロック</button><button data-act="report" data-id="${out.safety.target}" data-where="${out.safety.where}">通報</button></div>`:""}</div>`;
  }
  const focused=document.activeElement&&document.activeElement.id,sel=focused&&[document.activeElement.selectionStart,document.activeElement.selectionEnd];
  main.innerHTML=out.body;
  main.scrollTop=scrollTop?0:keepScroll;
  if(focused){const el=document.getElementById(focused);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  const tabs=$("#tabs");tabs.hidden=!S.me;
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",v.v==="tab"&&b.dataset.tab===v.tab?"page":"false"));
  $("#newdot").hidden=!(S.me&&incoming().length);
}

// ---------------------------------------------------------------- actions
function finishOnboarding(){
  const d=S.draft;
  const name=d.pen.trim();
  if(hasContact(name)||hasContact(d.bio||""))return toast("プロフィールに連絡先やSNSのIDは書けません。");
  S.me={pen:name,age:d.age||"30代前半",pref:d.pref||"東京都",bio:(d.bio||"").trim(),g:d.g,seek:[...d.seek],paused:false,seed:0};
  const first={id:id("d"),author:"me",body:d.first.trim(),scope:"intro",prompt:"今日うれしかったこと",at:now()};
  S.diaries.push(first);
  const w=WRITERS.find(w=>mutual(S.me,w));
  if(w){const q=sentences(first.body)[0];S.letters.push({id:id("l"),from:w.id,to:"me",diary:first.id,quote:q,body:`「${q}」という一文が、今日の自分にも少し重なりました。よかったら、もう少しお話を聞かせてください。`,status:"pending",at:now()})}
  S.draft={};home("read");
}
function closeAll(uid){
  for(const c of S.conns)if(c.partner===uid&&c.status==="active")c.status="ended";
  for(const l of S.letters)if((l.from===uid||l.to===uid)&&l.status==="pending")l.status="closed";
}
const act={
  "ob-next"(){const d=S.draft;if(d.step<3){d.step++;render(true)}else finishOnboarding()},
  writer(e){go({v:"writer",id:e.dataset.id})},
  pick(e){const v=cur();const same=v.d===e.dataset.d&&v.s===e.dataset.s;v.d=same?null:e.dataset.d;v.s=same?null:e.dataset.s;render()},
  compose(){const v=cur();go({v:"compose",d:v.d,s:v.s,text:""})},
  send(){
    const v=cur(),d=diary(v.d),body=(v.text||"").trim();
    if(relation(d.author).kind!=="none")return toast("この人とは、すでにやりとりがあります。");
    if(pendingOut()>=LIMIT.pending)return toast(`返事を待っている感想が${LIMIT.pending}通あります。ひとつ落ち着いてから、また送れます。`);
    if(active().length>=LIMIT.conns)return toast(`いまは${LIMIT.conns}人とつながっています。今のつながりを大切にする期間です。`);
    if(len(body)<LIMIT.min)return toast(`感想は${LIMIT.min}文字以上で書いてください。`);
    if(hasContact(body))return toast("つながる前の連絡先の交換は控えてください。電話番号・メールアドレス・URL・SNSのIDを消してから送れます。");
    S.letters.push({id:id("l"),from:"me",to:d.author,diary:d.id,quote:v.s,body,status:"pending",at:now()});
    home("read");toast("届けました。返事はゆっくり待ちましょう。");
  },
  letter(e){go({v:"letter",id:e.dataset.id})},
  accept(e){
    const l=S.letters.find(x=>x.id===e.dataset.id);
    if(active().length>=LIMIT.conns)return toast(`つながりは同時に${LIMIT.conns}人までです。`);
    l.status="accepted";const c=connect(l.from);
    sheet(`<h4>つながりました</h4><p>つながることは、交際への同意ではありません。ふたりの日記で、ゆっくり知り合っていきましょう。いつでも理由なしで関係を終えられます。</p><button class="primary" data-ok>わかりました</button>`,
      (el,close)=>{el.querySelector("[data-ok]").onclick=()=>{close();S.stack.pop();go({v:"conn",id:c.id,text:""})}});
  },
  decline(e){ask("見送りますか","相手には通知されません。理由を伝える必要もありません。","見送る",false,()=>{S.letters.find(x=>x.id===e.dataset.id).status="declined";back()})},
  conn(e){go({v:"conn",id:e.dataset.id,text:""})},
  page(e){const v=cur();S.pages.push({id:id("p"),conn:e.dataset.id,author:"me",body:v.text.trim(),at:now(),replies:[]});v.text="";render()},
  reply(e){
    const p=S.pages.find(x=>x.id===e.dataset.id);
    sheet(`<div class="quote">${esc(p.body)}</div><textarea id="replybody" rows="3" maxlength="2000" placeholder="返事を添える"></textarea><button class="primary" data-ok disabled>添える</button>`,
      (el,close)=>{const t=el.querySelector("textarea"),b=el.querySelector("[data-ok]");t.oninput=()=>b.disabled=!t.value.trim();b.onclick=()=>{p.replies.push({author:"me",body:t.value.trim(),at:now()});close();render()}});
  },
  photo(e){go({v:"photo",id:e.dataset.id})},
  propose(e){const c=S.conns.find(x=>x.id===e.dataset.id);c.photo="proposed";c.by="me";c.byAt=now();render()},
  "cancel-photo"(e){const c=S.conns.find(x=>x.id===e.dataset.id);c.photo="hidden";c.by=null;render()},
  menu(){S.menu=!S.menu;render()},
  end(e){S.menu=false;render();ask("関係を終えますか","理由を伝える必要はありません。相手には「この関係は終わりました」とだけ表示され、ふたりの日記は読めなくなります。もう一度つながることはできません。","関係を終える",true,()=>{S.conns.find(x=>x.id===e.dataset.id).status="ended";home("together")})},
  block(e){S.menu=false;render();ask("ブロックしますか","相手には通知されません。お互いに紹介されなくなり、つながりや感想も閉じます。","ブロックする",true,()=>{S.blocked.add(e.dataset.id);closeAll(e.dataset.id);home();toast("ブロックしました。")})},
  report(e){
    S.menu=false;render();const target=e.dataset.id,where=e.dataset.where;let cat=null;
    sheet(`<h4>通報</h4>${hint("運営が内容を確認します。通報すると、この人は自動的にブロックされます。相手に通報したことは伝わりません。")}
      <div class="chips">${REPORT.map((r,i)=>`<button class="chip" data-c="${i}" aria-pressed="false">${r}</button>`).join("")}</div>
      <textarea rows="3" maxlength="1000" placeholder="状況の説明（任意）"></textarea><button class="primary" data-ok disabled>通報する</button><button class="ghost" data-no>やめておく</button>`,
      (el,close)=>{el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=+b.dataset.c;el.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));el.querySelector("[data-ok]").disabled=false});
        el.querySelector("[data-no]").onclick=close;
        el.querySelector("[data-ok]").onclick=()=>{S.reports.push({target,where,category:REPORT[cat],note:el.querySelector("textarea").value.trim(),at:now()});S.blocked.add(target);closeAll(target);close();home();toast("通報を受け付けました。この人はブロックされました。")}});
  },
  settings(){go({v:"settings"})},
  "set-seek"(e){const s=new Set(S.me.seek);s.has(e.dataset.g)?s.delete(e.dataset.g):s.add(e.dataset.g);if(!s.size)return toast("出会いたい相手を1つ以上選んでください。");S.me.seek=[...s];S.intro=null;render()},
  unblock(e){S.blocked.delete(e.dataset.id);render()},
  wipe(){ask("最初からやり直しますか","日記、感想、ふたりの日記、設定が消えます。","やり直す",true,()=>{Object.assign(S,{me:null,diaries:[],letters:[],conns:[],pages:[],blocked:new Set(),reports:[],intro:null,stack:[{v:"tab",tab:"read"}],draft:{}});render(true)})},
  "toggle-prompt"(){S.draft.usePrompt=!S.draft.usePrompt;render()},
  write(e){
    const d=S.draft;S.diaries.push({id:id("d"),author:"me",body:d.entry.trim(),scope:d.scope,prompt:d.usePrompt?e.dataset.prompt:null,at:now()});
    d.entry="";document.activeElement?.blur();render();toast("書きました。");
  },
};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-g],[data-seek],[data-scope],#back");if(!t)return;
  if(t.id==="back"){if(!S.me){S.draft.step--;render(true)}else back();return}
  if(t.dataset.tab){home(t.dataset.tab);return}
  if(t.dataset.act){act[t.dataset.act](t);return}
  if(t.dataset.g&&!S.me){S.draft.g=t.dataset.g;render();return}
  if(t.dataset.seek){const s=new Set(S.draft.seek);s.has(t.dataset.seek)?s.delete(t.dataset.seek):s.add(t.dataset.seek);S.draft.seek=[...s];render();return}
  if(t.dataset.scope){S.draft.scope=t.dataset.scope;render();return}
});
document.addEventListener("input",e=>{
  const t=e.target,d=S.draft,v=cur();
  const map={pen:"pen",bio:"bio",first:"first",entry:"entry"};
  if(map[t.id]){d[map[t.id]]=t.value;
    const btn=document.querySelector('[data-act="ob-next"],[data-act="write"]');
    if(btn){if(t.id==="entry")btn.disabled=!t.value.trim();else if(t.id==="pen")btn.disabled=!t.value.trim();else if(t.id==="first")btn.disabled=!t.value.trim()}
  }
  if(t.id==="letter"){v.text=t.value;const n=len(t.value);$('[data-act="send"]').disabled=n<LIMIT.min;$("#remain").textContent=n>0&&n<LIMIT.min?`あと${LIMIT.min-n}文字`:""}
  if(t.id==="pagebody"){v.text=t.value;$('[data-act="page"]').disabled=!t.value.trim()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="adult"){S.draft.adult=t.checked;render()}
  if(t.id==="age")S.draft.age=t.value;
  if(t.id==="pref")S.draft.pref=t.value;
  if(t.id==="pause"){S.me.paused=t.checked;render()}
});
render();
</script>
</body></html>
